{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<header>
    <nav class="bg-zinc-700 text-white flex justify-between items-center px-3 py-3 max-lg:hidden">
        <div class="">
            <a href="{% url 'index' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Inicio</a>
            <a href="{% url 'cursos' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Cursos</a>
            {% if perms.cursos.change_curso %}
                <a href="{% url 'crearCurso' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Add Curso</a>
            {% endif %}
            
        </div>

        <div class="flex">
            {% if user.is_authenticated %}
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Cerrar sesion</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-zinc-600">Iniciar sesion</a>            
            {% endif %}

            {% if user.foto %}
                <img src="{{ user.foto.url }}" alt="Foto de perfil" class="flex w-8 h-8 rounded-full">
            {% else %}
                <img src="{% static 'images/foto_gatito.jpeg' %}" alt="Foto de perfil por defecto" class="flex w-8 h-8 rounded-full">
            {% endif %}
        </div>
    </nav>
</header>
<body class="bg-zinc-200">
    {% block body %}
    {% endblock %}
</body>
</html>
